name: Docs – Build & Deploy (MkDocs → GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true  # lets the action enable Pages if allowed by repo/org

      # Build frontend docs (TypeDoc -> docs/frontend)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend docs
        working-directory: frontend
        run: |
          npm ci
          npm run docs

      # Build MkDocs site (outputs to ./site)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs toolchain + backend deps
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material "mkdocstrings[python]"
          pip install -r backend/requirements.txt
      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
