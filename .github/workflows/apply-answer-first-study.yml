name: Apply answer-first Study patch

on:
  push:
    branches:
      - feature/answer-first-recall
    paths:
      - scripts/patch_answer_first_study.py

permissions:
  contents: write

jobs:
  patch-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic Study patch
        run: |
          test -f scripts/patch_answer_first_study.py || exit 0
          python scripts/patch_answer_first_study.py
      - name: Commit patched Study page
        run: |
          if git diff --quiet; then
            echo "No Study changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Study.tsx
          git commit -m "feat: require answer commitment before study reveal"
          git push
