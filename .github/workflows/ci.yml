name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Auto-format PRs, then push fixes (runs only for same-repo PR branches)
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install format tools
        run: |
          pip install black ruff

      - name: Run formatters (fix in place)
        run: |
          # exclude Alembic autogen migrations
          ruff check --fix . --exclude alembic/versions
          black . --extend-exclude 'alembic/versions'

      - name: Commit & push if changed (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with black/ruff"
            git push
          fi

  build-test:
    runs-on: ubuntu-latest
    needs: format
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "backend/requirements.txt not found"; exit 1
          fi

      - name: Install dev/test tools
        run: |
          pip install pytest ruff black

      - name: Show environment (debug)
        run: |
          python --version
          pip list

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Lint with Ruff
        run: ruff check . --exclude alembic/versions

      - name: Check formatting with Black
        run: black --check . --extend-exclude 'alembic/versions'
