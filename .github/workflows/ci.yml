name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flashquest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff black
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Lint
        run: ruff check . --exclude alembic/versions
      - name: Format check
        run: black --check . --extend-exclude 'alembic/versions'

  frontend:
    name: Frontend · typecheck/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build

  migrations:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashcards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flashcards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flashcards
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Upgrade schema
        run: alembic -c alembic.ini upgrade head
      - name: Show migration state
        run: alembic -c alembic.ini current

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config
      - name: Build API and web images
        run: docker compose build api web
