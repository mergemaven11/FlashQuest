name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---- Auto-format job (only pushes on same-repo PRs) ----
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Run formatters (fix in place)
        working-directory: backend
        run: |
          ruff check --fix .
          black .

      - name: Commit & push if changed (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with black/ruff [skip ci]"
            git push
          fi

  # ----  existing test matrix ----
  build-test:
    runs-on: ubuntu-latest
    needs: format   # ensures format runs first (this run still tests pre-push code; the pushed fixes trigger a new run)
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "backend/requirements.txt not found"; exit 1
          fi
      - run: pip install pytest ruff black
      - name: Run tests
        env: { PYTHONPATH: . }
        run: pytest --maxfail=1 --disable-warnings -q
      - name: Lint with Ruff
        run: ruff check .
      - name: Check formatting with Black
        run: black --check .
