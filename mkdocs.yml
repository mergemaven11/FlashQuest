site_name: FlashQuest’s
site_description: Learn it. Break it. Fix it. Remember it — Platform Engineering study, labs, and operations.
site_url: https://flashcards-docs.netlify.app/
repo_name: mergemaven11/FlashQuest
repo_url: https://github.com/mergemaven11/FlashQuest
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["backend"]
          setup_commands:
            - import os, sys
            - sys.path.insert(0, os.path.abspath("backend"))
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Study:
      - Curriculum: CURRICULUM.md
      - Break/Fix Labs: LABS.md
  - Platform Engineering:
      - Architecture & Design: PLATFORM_ENGINEERING.md
      - Operations & Deployment: OPERATIONS.md
  - Reference:
      - Backend API: backend/api.md
      - Frontend: frontend/modules.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mergemaven11/FlashQuest
      name: FlashQuest’s on GitHub
