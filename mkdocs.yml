site_name: Hiring Flashcards Docs
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Either of these will work; keeping both is extra-safe on Windows.
          paths: [ "backend" ]   # adds to sys.path
          setup_commands:
            - import os, sys
            - sys.path.insert(0, os.path.abspath("backend"))
          options:
            docstring_style: google
            show_source: false

nav:
  - Overview: index.md
  - Backend:
      - API: backend/api.md
  - Frontend:
      - Reference: frontend/modules.md   # TypeDoc's main index
