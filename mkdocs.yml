site_name: FlashQuest Docs
site_description: Game-like spaced repetition with production-minded platform engineering.
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["backend"]
          setup_commands:
            - import os, sys
            - sys.path.insert(0, os.path.abspath("backend"))
          options:
            docstring_style: google
            show_source: false

nav:
  - Overview: index.md
  - Platform Engineering: PLATFORM_ENGINEERING.md
  - Backend:
      - API: backend/api.md
  - Frontend:
      - Reference: frontend/modules.md
