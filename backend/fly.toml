# fly.toml app configuration file generated on 2025-08-19T14:38:34-04:00
#
# See https://fly.io/docs/reference/configuration/ for information on this file.
# Production deploys are triggered from GitHub Actions on pushes to main.
# Deploy token configured: trigger a fresh production rollout.

app = 'flashcards-tobias'
primary_region = 'dfw'

[build]
  dockerfile = "./Dockerfile"

[deploy]
  release_command = "sh -c 'alembic -c /app/alembic.ini upgrade head && python -m app.seed'"

[env]
  PORT = "8080"
  APP_ENV = "production"
  FRONTEND_URL = "https://flaskquest.netlify.app"
  API_PUBLIC_URL = "https://flashcards-tobias.fly.dev"
  EMAIL_DELIVERY_MODE = "resend"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  soft_limit = 20
  hard_limit = 40

[[http_service.checks]]
  grace_period = "10s"
  interval = "10s"
  method = "GET"
  path = "/health/ready"
  timeout = "2s"

[mounts]
  source = "data"
  destination = "/data"
