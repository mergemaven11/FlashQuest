repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.9  # Use the latest version from ruff releases
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.8.0  # Check PyPI for the latest
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0  # Check for latest mypy release
    args: ["--install-types", "--non-interactive"]
    hooks:
      - id: mypy
    
