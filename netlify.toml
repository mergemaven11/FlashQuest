# netlify.toml (repo root)

[build]
  publish = "site"
  command = """
  set -e
  python -m venv .venv
  . .venv/bin/activate
  python -m pip install --upgrade pip
  pip install mkdocs mkdocs-material "mkdocstrings[python]"
  pip install -r backend/requirements.txt
  cd frontend && npm ci && npm run docs && cd ..
  python -m mkdocs build --strict
  """
  # Optional: skip builds if docs-relevant paths didn't change
  ignore = "git diff --quiet ${CACHED_COMMIT_REF:-HEAD~1} $COMMIT_REF -- mkdocs.yml docs/ frontend/ backend/ .github/workflows/ || exit 1"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "20.19.0"
