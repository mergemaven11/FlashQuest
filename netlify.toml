# One Netlify production site:
#   /       -> FlashQuest React app
#   /docs/  -> MkDocs + TypeDoc documentation

[build]
  publish = "frontend/dist"
  command = """
  set -e
  python -m venv .venv
  . .venv/bin/activate
  python -m pip install --upgrade pip
  pip install mkdocs mkdocs-material "mkdocstrings[python]"
  pip install -r backend/requirements.txt
  cd frontend
  npm ci
  npm run build
  npm run docs
  cd ..
  python -m mkdocs build --strict --site-dir frontend/dist/docs
  """

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "20.19.0"
  VITE_API_URL = "https://flashcards-tobias.fly.dev"

[[redirects]]
  from = "/docs"
  to = "/docs/"
  status = 301

# Existing static files, including /docs/**, are served before this SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
